<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>지능형 AI 영수증 분석앱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 300: '#93c5fd', 400: '#60a5fa', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af', 800: '#1e3a8a', 900: '#172554' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100%; background-color: #f8fafc; touch-action: auto !important; }
    .moving-light { animation: scan-motion 2s ease-in-out infinite; }
    @keyframes scan-motion { 0%, 100% { top: 5%; opacity: 0.2; } 50% { top: 90%; opacity: 0.9; } }
    .cropper-point { display: none !important; }
    .cropper-point.point-s {
      display: block !important; bottom: -4px !important; left: 50% !important; margin-left: -22px !important;
      width: 44px !important; height: 7px !important; background-color: #2563eb !important; border: 1.5px solid #ffffff !important;
      border-radius: 9999px !important; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45) !important; z-index: 30 !important;
    }
    .cropper-view-box { outline: 2px solid #2563eb !important; }
    .cropper-line { background-color: transparent !important; }
    .cropper-line.line-n { top: 0 !important; height: 4px !important; background-color: #2563eb !important; }
    .cropper-line.line-s { bottom: 0 !important; height: 4px !important; background-color: #2563eb !important; }
    .cropper-line.line-w { left: 0 !important; width: 2.5px !important; background-color: #2563eb !important; }
    .cropper-line.line-e { right: 0 !important; width: 2.5px !important; background-color: #2563eb !important; }
    .cropper-modal { background-color: rgba(15, 23, 42, 0.75) !important; }
    .cropper-container { width: 100% !important; height: 100% !important; touch-action: none !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <!-- 관리자 암호 인증 모달 -->
  <div id="authModal" class="fixed inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl border border-slate-200">
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-brand-50 text-brand-600 rounded-2xl mx-auto flex items-center justify-center text-xl shadow-sm mb-2">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-lg font-black text-slate-900">관리자 암호 인증</h2>
        <p class="text-xs text-slate-500">서비스 이용을 위해 관리자가 지정한 접근 암호를 입력하세요.</p>
      </div>
      <div>
        <input type="password" id="authPasswordInput" placeholder="접근 암호 입력" class="w-full bg-slate-50 border-2 border-slate-200 focus:border-brand-600 focus:bg-white text-center font-bold text-base py-3 px-4 rounded-xl outline-none transition">
      </div>
      <button type="button" onclick="verifyPassword()" class="w-full bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-black text-sm py-3.5 rounded-xl shadow-lg transition">
        인증하기
      </button>
    </div>
  </div>

  <!-- 자르기 모달 -->
  <div id="cropperModal" class="fixed inset-0 z-50 bg-slate-950/95 hidden flex flex-col justify-between p-2 select-none overflow-hidden" style="height: 100dvh; max-height: 100dvh; touch-action: none;">
    <div class="flex items-center justify-between text-white border-b border-slate-800 pb-2 px-1 shrink-0 h-11">
      <span class="text-sm font-black flex items-center gap-2"><i class="fa-solid fa-crop-simple text-amber-400"></i> 영역 선택 (테두리 조절)</span>
      <button type="button" onclick="cancelCrop()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <div class="relative w-full my-1 bg-black rounded-xl overflow-hidden p-2 box-border flex items-center justify-center shrink-0" style="height: calc(100dvh - 110px); max-height: calc(100dvh - 110px);">
      <div id="cropperWrapper" class="w-full h-full relative overflow-hidden flex items-center justify-center">
        <img id="imageToCrop" src="" alt="자르기 원본" class="block max-h-full max-w-full object-contain">
      </div>
    </div>
    <div class="px-1 shrink-0 pb-1">
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="cancelCrop()" class="w-full bg-slate-800 active:scale-95 text-white font-black text-sm py-3 rounded-xl">취소</button>
        <button type="button" onclick="confirmCrop()" class="w-full bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-black text-sm py-3 rounded-xl shadow-lg flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-check"></i> <span>영역 자르기 완료</span>
        </button>
      </div>
    </div>
  </div>

  <div class="w-full max-w-md mx-auto bg-white min-h-screen flex flex-col shadow-2xl relative border-x border-slate-200">
    <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-40 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-2.5 min-w-0 flex-1 pr-2">
        <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md shrink-0"><i class="fa-solid fa-receipt text-lg"></i></div>
        <div class="min-w-0 flex-1">
          <p class="text-[10px] font-black text-brand-300 tracking-tight leading-none mb-1">가계동향조사를 위한</p>
          <h1 class="font-black text-sm sm:text-base tracking-tight text-white truncate leading-none">지능형 AI 영수증 분석앱</h1>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="resetSystem()" class="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full active:bg-slate-700 transition" title="초기화"><i class="fa-solid fa-rotate-right text-xs"></i></button>
      </div>
    </header>

    <main class="flex-1 p-4 space-y-4 bg-white pb-24" style="touch-action: auto;">
      <!-- 스캐너 섹션 -->
      <section class="bg-white rounded-2xl p-4 border-2 border-slate-200 shadow-sm relative overflow-hidden space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-black text-slate-700 flex items-center gap-1.5"><i class="fa-solid fa-camera-retro text-brand-600"></i> 스캔 상태</span>
          <div class="flex items-center gap-1.5">
            <span id="activeModelBadge" class="text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold px-2.5 py-0.5 rounded-full hidden">AI: -</span>
            <span id="scanStatusBadge" class="text-[11px] bg-slate-100 text-slate-700 border border-slate-300 font-extrabold px-2.5 py-0.5 rounded-full">● 대기 중</span>
          </div>
        </div>
        <div class="relative w-full min-h-[190px] bg-slate-50 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center p-2">
          <div id="scannerLine" class="hidden absolute left-2 right-2 h-1 bg-gradient-to-r from-transparent via-brand-600 to-transparent shadow-[0_0_10px_#2563eb] z-20 moving-light pointer-events-none"></div>
          <div id="receiptPreviewContainer" class="w-full h-full flex flex-col items-center justify-center p-2 text-center">
            <div class="w-12 h-12 rounded-2xl bg-white border border-slate-200 text-slate-400 flex items-center justify-center shadow-sm mb-1.5"><i class
